name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: format, lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .aider-desk/extensions/aiderdesk-agent-bus

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .aider-desk/extensions/aiderdesk-agent-bus/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Run every check even when an earlier one fails, so the job reports all
      # problems in one pass instead of one failure per push.
      - name: Formatting
        if: ${{ !cancelled() }}
        run: npm run format:check

      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Types
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: Tests
        if: ${{ !cancelled() }}
        run: npm test
